name: Habitat de la France

# Forêts, relief, roche, zones protégées et communes, bloc par bloc, publiés comme asset de
# la release « habitat ». Le job quotidien télécharge cet asset ; rien n'entre dans git.
# Incrémental : seuls les blocs qui manquent à la release sont construits (une construction
# interrompue publie ce qu'elle a fait). Changer champi.france.FORMAT reconstruit tout.
on:
  push:
    branches: [main]
    paths: [".github/workflows/habitat.yml", "champi/france.py", "champi/habitat.py", "champi/sources.py"]
  schedule:
    - cron: "0 2 * * 0"       # chaque dimanche : complète les blocs manquants (rien sinon)
  workflow_dispatch:
    inputs:
      groupes:
        description: "Nombre de tâches parallèles"
        default: "40"
      tout:
        description: "Tout reconstruire (ignorer la release publiée)"
        type: boolean
        default: false

permissions:
  contents: write

# Une construction en remplace une autre : seule la plus récente compte.
concurrency:
  group: habitat
  cancel-in-progress: true

jobs:
  preparer:
    runs-on: ubuntu-latest
    outputs:
      groupes: ${{ steps.liste.outputs.groupes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Index de la release publiée
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p habitat
          if gh release download habitat -p habitat.tar -D "$RUNNER_TEMP"; then
            tar -xf "$RUNNER_TEMP/habitat.tar" -C habitat blocs.json communes.json
          fi
      - id: liste
        run: echo "groupes=$(python -m champi.france preparer --groupes ${{ inputs.groupes || 40 }} ${{ inputs.tout && '--tout' || '' }} | tail -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: habitat-preparation
          path: |
            habitat/communes.json
            habitat/liste.json

  blocs:
    needs: preparer
    if: needs.preparer.outputs.groupes != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 8   # au-delà, les services de l'IGN refusent une partie des requêtes
      matrix:
        groupe: ${{ fromJSON(needs.preparer.outputs.groupes) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: habitat-preparation
          path: habitat
      - run: python -m champi.france groupe ${{ matrix.groupe }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: habitat-groupe-${{ matrix.groupe }}
          path: |
            habitat/blocs
            habitat/meta
            habitat/echantillon
            habitat/vides
          if-no-files-found: ignore

  # Même si des groupes ont échoué : on publie ce qui est fait, la suite viendra.
  assembler:
    needs: [preparer, blocs]
    if: ${{ !cancelled() && needs.preparer.outputs.groupes != '[]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Release publiée (complétée par cette construction)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p habitat
          if gh release download habitat -p habitat.tar -D "$RUNNER_TEMP"; then
            tar -xf "$RUNNER_TEMP/habitat.tar" -C habitat
            rm "$RUNNER_TEMP/habitat.tar"
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: habitat-*
          path: habitat
          merge-multiple: true
      - run: python -m champi.france assembler
      - name: Publier la release « habitat »
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -cf habitat.tar -C habitat blocs blocs.json communes.json echantillon.npz
          ls -la habitat.tar
          gh release view habitat >/dev/null 2>&1 || gh release create habitat --title "Habitat de la France" \
            --notes "Forêts, relief, roche, zones protégées et communes par blocs de 25 km (workflow habitat.yml). Sources IGN, BRGM, INPN, Licence Ouverte."
          gh release upload habitat habitat.tar --clobber
