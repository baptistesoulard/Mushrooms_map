name: Carte quotidienne

# Chaque matin : météo du jour (dépôt public d'Open-Meteo) → données du site → GitHub Pages.
# L'habitat de la France (~250 Mo) vient de la release « habitat » (workflow habitat.yml).
# Rien n'est commité : les données du jour vivent dans l'artefact déployé, pas dans git.
on:
  schedule:
    - cron: "20 4 * * *"      # 05 h 20 ou 06 h 20 à Paris selon l'heure d'été
  push:
    branches: [main]
  # La release « habitat » vient de changer (blocs construits, couche « d ») : la carte suit.
  workflow_run:
    workflows: ["Habitat de la France", "pH du sol dans l'habitat"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests -q
      - name: Habitat de la France
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download habitat -p habitat.tar -D "$RUNNER_TEMP"
          mkdir -p site/habitat
          tar -xf "$RUNNER_TEMP/habitat.tar" -C site/habitat
          du -sh site/habitat
      - name: Calculer la carte du jour
        run: |
          python -m champi.export_france
          rm site/habitat/echantillon.npz   # lu par l'export seulement : pas à publier
      # Avant le déploiement : le site en ligne est encore la publication précédente, à laquelle
      # les alertes se comparent. Une alerte manquée n'empêche jamais la carte de paraître.
      - name: Alertes (ntfy)
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALERTES: ${{ vars.ALERTES }}
        run: python -m champi.alertes
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
