name: Carte quotidienne

# Chaque nuit : météo du jour (dépôt public d'Open-Meteo) → données du site → GitHub Pages.
# L'habitat de la France (~250 Mo) vient de la release « habitat » (workflow habitat.yml).
# Rien n'est commité : les données du jour vivent dans l'artefact déployé, pas dans git.
on:
  # GitHub ne tient pas l'heure de ses départs programmés : depuis la fin de l'été 2026, il les crée
  # souvent avec des heures de retard (6 h le 31 octobre, 7 h le 1er novembre, et le 2 novembre
  # toujours rien à 7 h 15). Trois rendez-vous dans la nuit, dès 0 h 20 à Paris (1 h 20 l'été) :
  # le premier qui part publie la carte du jour, les suivants la trouvent en ligne et s'arrêtent
  # (job « verifier », champi/publication.py).
  schedule:
    - cron: "20 23 * * *"
    - cron: "50 1 * * *"
    - cron: "20 4 * * *"
  push:
    branches: [main]
  # La release « habitat » vient de changer (blocs construits, couche « d ») : la carte suit.
  workflow_run:
    workflows: ["Habitat de la France", "pH du sol dans l'habitat"]
    types: [completed]
  workflow_dispatch:
    inputs:
      essai_alertes:
        description: "Envoyer une notification d'essai à chaque abonné aux alertes"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Un départ programmé qui trouve la carte du jour en ligne s'arrête ici, en quelques secondes.
  # Les autres déclencheurs (commit, release de l'habitat, lancement à la main) calculent toujours.
  verifier:
    runs-on: ubuntu-latest
    outputs:
      a_faire: ${{ steps.garde.outputs.a_faire }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'schedule'
      - id: garde
        if: github.event_name == 'schedule'
        run: python3 -m champi.publication

  construire:
    needs: verifier
    if: needs.verifier.outputs.a_faire != 'non'
    # Un calcul à la fois ; en attente, le plus récent remplace les autres. Au niveau des jobs, pas
    # du workflow : un départ programmé qui s'arrête n'annule jamais un calcul en attente.
    concurrency:
      group: carte
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests -q
      - name: Habitat de la France
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download habitat -p habitat.tar -D "$RUNNER_TEMP"
          mkdir -p site/habitat
          tar -xf "$RUNNER_TEMP/habitat.tar" -C site/habitat
          du -sh site/habitat
      - name: Calculer la carte du jour
        env:
          # Le site dit si les alertes sont branchées, sans jamais voir les secrets eux-mêmes.
          ALERTES_ACTIVES: ${{ secrets.VAPID_PRIVEE != '' && secrets.ALERTES_JETON != '' && vars.ALERTES_DEPOT != '' }}
        run: |
          python -m champi.export_france
          rm site/habitat/echantillon.npz   # lu par l'export seulement : pas à publier
      # Avant le déploiement : le site en ligne est encore la publication précédente, à laquelle
      # les alertes se comparent. Une alerte manquée n'empêche jamais la carte de paraître.
      - name: Alertes personnalisées
        continue-on-error: true
        env:
          ALERTES_DEPOT: ${{ vars.ALERTES_DEPOT }}
          ALERTES_JETON: ${{ secrets.ALERTES_JETON }}
          VAPID_PRIVEE: ${{ secrets.VAPID_PRIVEE }}
        run: python -m champi.alertes ${{ inputs.essai_alertes && '--essai' || '' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publier:
    needs: construire
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
